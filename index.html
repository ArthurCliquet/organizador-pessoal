<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nock</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#131826" />
    <script>
      try {
        var t = localStorage.getItem('nock:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="bg-app-bg text-app-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
